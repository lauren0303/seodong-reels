name: 사이트 배포

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:            # 매일 릴스 업데이트가 끝나면 배포
    workflows: ["릴스 업데이트"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 사이트 파일 모으기 (썸네일 축소)
        run: |
          pip install --quiet pillow
          python scripts/build_site.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # 가끔 GitHub 쪽에서 방금 올린 파일 묶음을 못 찾는 일시 오류가 난다
      # ("Fetching artifact metadata failed"). 한 번 실패하면 1분 쉬고 다시 배포한다.
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000   # GitHub이 허용하는 최대 10분
      - name: 1분 쉬었다가 다시 배포
        if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
